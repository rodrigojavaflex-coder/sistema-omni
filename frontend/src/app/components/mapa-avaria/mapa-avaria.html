<div class="mapa-avaria" *ngIf="modeloId">
  <p class="mapa-error" *ngIf="error()" role="alert">{{ error() }}</p>
  <p class="mapa-loading" *ngIf="loading()">Carregando desenho do veículo...</p>

  <div class="mapa-chrome" *ngIf="!loading() && vistas().length">
    <div class="mapa-vistas" role="tablist" aria-label="Vistas do veículo">
      <button
        type="button"
        class="mapa-vista-btn"
        *ngFor="let vista of vistas()"
        [class.is-active]="vista.id === vistaId()"
        (click)="selecionarVista(vista.id)"
      >
        {{ vista.descricao }}
      </button>
    </div>
    <div class="mapa-toolbar">
      <button type="button" class="btn btn-secondary" (click)="alternarPendentes()">
        {{ textoPendentes() }}
      </button>
      <button type="button" class="btn btn-secondary" [disabled]="!podeZoomOut()" (click)="zoomOut()" aria-label="Diminuir zoom">
        −
      </button>
      <span class="mapa-zoom-label">{{ textoEscala() }}</span>
      <button type="button" class="btn btn-secondary" [disabled]="!podeZoomIn()" (click)="zoomIn()" aria-label="Aumentar zoom">
        +
      </button>
      <button type="button" class="btn btn-secondary" (click)="resetarZoom()">1x</button>
    </div>
    <div class="mapa-toolbar" *ngIf="!readonly">
      <span class="mapa-zoom-label">{{ textoMarcasAtuais() }}</span>
      <button
        type="button"
        class="btn btn-secondary"
        [disabled]="marcasAtuais().length === 0"
        (click)="desfazerUltimaMarca()"
        aria-label="Desfazer último ponto"
      >
        ↶ Desfazer
      </button>
      <button
        type="button"
        class="btn btn-secondary"
        [disabled]="marcasAtuais().length === 0"
        (click)="limparMarcas()"
        aria-label="Limpar todos os pontos"
      >
        Limpar
      </button>
    </div>
    <p class="mapa-hint">{{ textoAjudaMapa() }}</p>
    <p
      class="mapa-legenda-os"
      *ngIf="mostrarPendentes() && legendaOsPendentes()"
      aria-label="Legenda das ordens de serviço no mapa"
    >
      {{ legendaOsPendentes() }}
    </p>
  </div>

  <div
    class="mapa-viewport"
    #viewport
    *ngIf="imagemUrl()"
    (mousedown)="onMouseDown($event)"
    (mousemove)="onMouseMove($event)"
    (mouseup)="onMouseUp()"
    (mouseleave)="onMouseUp()"
  >
    <div class="mapa-frame" [style.transform]="transformCss()">
      <img
        #mapaImg
        [src]="imagemUrl()!"
        alt="Desenho do veículo para marcar o local da avaria"
        draggable="false"
        (load)="onImagemCarregada()"
      />
      <div
        class="mapa-overlay"
        role="button"
        tabindex="0"
        aria-label="Área para marcar o local da irregularidade"
        (click)="onToqueMapa($event)"
      >
        <span
          *ngFor="let marca of pendentes()"
          class="mapa-mark mapa-mark-pending"
          [class.mapa-mark-hidden]="!mostrarPendentes()"
          [class.mapa-mark-resolvida]="marca.resolvido"
          [style.left.%]="marca.xPct"
          [style.top.%]="marca.yPct"
          [style.width.px]="tamanhoMarcaPx()"
          [style.height.px]="tamanhoMarcaPx()"
          [style.transform]="transformMarca()"
          [style.font-size.px]="tamanhoMarcaPx() * 0.32"
        >
          <span class="mapa-mark-label">{{ marca.rotulo }}</span>
        </span>
        <span
          *ngFor="let atual of marcasAtuais(); let i = index; let last = last"
          class="mapa-mark mapa-mark-current"
          [class.mapa-mark-interactive]="!readonly"
          [class.mapa-mark-moving]="indiceArrastando() === i"
          [style.left.%]="atual.xPct"
          [style.top.%]="atual.yPct"
          [style.width.px]="tamanhoMarcaPx()"
          [style.height.px]="tamanhoMarcaPx()"
          [style.transform]="transformMarca()"
          [style.font-size.px]="tamanhoMarcaPx() * 0.32"
          (pointerdown)="onMarcaPointerDown(i, $event)"
          (pointermove)="onMarcaPointerMove(i, $event)"
          (pointerup)="onMarcaPointerUp(i, $event)"
          (pointercancel)="onMarcaPointerUp(i, $event)"
          role="button"
          [attr.aria-label]="'Ponto ' + atual.rotulo + '. Arraste para mover'"
        >
          <span class="mapa-mark-label">{{ atual.rotulo }}</span>
          <button
            *ngIf="last && !readonly"
            type="button"
            class="mapa-mark-remove"
            [style.width.px]="tamanhoRemovePx()"
            [style.height.px]="tamanhoRemovePx()"
            [style.top.px]="-tamanhoRemovePx() * 0.35"
            [style.right.px]="-tamanhoRemovePx() * 0.35"
            [style.font-size.px]="tamanhoRemovePx() * 0.7"
            (pointerdown)="$event.stopPropagation()"
            (click)="onRemoverUltimaClick($event)"
            aria-label="Remover último ponto"
          >
            ×
          </button>
        </span>
      </div>
    </div>
  </div>
</div>
