<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start" *ngIf="isNative">
      <ion-menu-button menu="main-menu"></ion-menu-button>
    </ion-buttons>
    <ion-title>Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="home-container" *ngIf="user">
    <div class="profile-card">
      <div class="profile-header">
        <div class="avatar">{{ user.nome.slice(0, 1) }}</div>
        <div class="profile-title">
          <h1>Olá, {{ user.nome }}</h1>
          <p>{{ user.email }}</p>
        </div>
      </div>

      <div class="profile-details">
        <div class="detail-row">
          <span class="detail-label">Perfil</span>
          <span class="detail-value">{{ profileDisplayName }}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Status</span>
          <span class="detail-badge" [class.active]="userAtivo">
            {{ userAtivo ? 'Ativo' : 'Inativo' }}
          </span>
        </div>
      </div>
    </div>

    <div class="home-actions" *ngIf="canStartVistoria || canStartValidacao">
      <ion-button
        *ngIf="canStartVistoria"
        expand="block"
        routerLink="/vistoria/inicio"
        class="home-action-btn"
      >
        <ion-icon
          slot="start"
          src="icons/feather-check-square.svg"
          aria-hidden="true"
        ></ion-icon>
        Iniciar Vistoria
      </ion-button>
      <ion-button
        *ngIf="canStartValidacao"
        expand="block"
        routerLink="/validacao/inicio"
        class="home-action-btn"
      >
        <ion-icon
          slot="start"
          src="icons/tabler-list-check.svg"
          aria-hidden="true"
        ></ion-icon>
        Iniciar Validação
      </ion-button>
    </div>

  </div>
</ion-content>
