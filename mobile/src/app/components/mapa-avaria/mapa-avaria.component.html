<p class="mapa-error" *ngIf="error()" role="alert">{{ error() }}</p>
<p class="mapa-loading" *ngIf="loading()">Carregando desenho...</p>

<div class="mapa-avaria" *ngIf="!loading() && vistas().length">
  <div class="chrome">
    <div class="vistas">
      <ion-button
        *ngFor="let vista of vistas()"
        size="small"
        [fill]="vista.id === vistaId() ? 'solid' : 'outline'"
        (click)="selecionarVista(vista.id)"
      >
        {{ vista.descricao }}
      </ion-button>
    </div>
    <div class="zoom-actions">
      <ion-button fill="outline" [disabled]="!podeZoomOut()" (click)="zoomOut()" aria-label="Diminuir zoom">
        <ion-icon slot="icon-only" name="remove-outline"></ion-icon>
      </ion-button>
      <span class="zoom-label">{{ textoEscala() }}</span>
      <ion-button fill="outline" [disabled]="!podeZoomIn()" (click)="zoomIn()" aria-label="Aumentar zoom">
        <ion-icon slot="icon-only" name="add-outline"></ion-icon>
      </ion-button>
      <ion-button fill="outline" [disabled]="!podeResetarZoom()" (click)="resetarZoom()">
        1x
      </ion-button>
      <ion-button fill="outline" (click)="alternarPendentes()">
        <ion-icon slot="start" [name]="iconePendentes()"></ion-icon>
        {{ textoPendentes() }}
      </ion-button>
    </div>
    <div class="actions marcas-actions">
      <span class="marcas-status">{{ textoMarcasAtuais() }}</span>
      <ion-button
        fill="outline"
        size="small"
        [disabled]="marcasAtuais().length === 0"
        (click)="desfazerUltimaMarca()"
      >
        <ion-icon slot="start" name="arrow-undo-outline"></ion-icon>
        Desfazer
      </ion-button>
      <ion-button
        fill="outline"
        size="small"
        [disabled]="marcasAtuais().length === 0"
        (click)="limparMarcas()"
      >
        <ion-icon slot="start" name="trash-outline"></ion-icon>
        Limpar
      </ion-button>
    </div>
    <p class="legend">{{ textoAjudaMapa() }}</p>
    <p
      class="legenda-os"
      *ngIf="mostrarPendentes() && legendaOsPendentes()"
      aria-label="Legenda das ordens de serviço no mapa"
    >
      {{ legendaOsPendentes() }}
    </p>
  </div>

  <div class="map-card">
    <div
      class="map-viewport"
      #viewport
      (mousedown)="onMouseDown($event)"
      (mousemove)="onMouseMove($event)"
      (mouseup)="onMouseUp()"
      (mouseleave)="onMouseUp()"
    >
      <div class="map-frame" [style.transform]="transformCss()">
        <img
          *ngIf="imagemUrl() as src"
          #mapaImg
          [src]="src"
          alt="Desenho do veículo"
          draggable="false"
          (load)="onImagemCarregada()"
        />
        <div
          class="map-overlay"
          role="button"
          tabindex="0"
          aria-label="Área para marcar o local da irregularidade"
          (click)="onToqueMapa($event)"
        >
          <span
            *ngFor="let marca of pendentes()"
            class="mark mark-pending"
            [class.mark-hidden]="!mostrarPendentes()"
            [style.left.%]="marca.xPct"
            [style.top.%]="marca.yPct"
            [style.width.px]="tamanhoMarcaPx()"
            [style.height.px]="tamanhoMarcaPx()"
            [style.transform]="transformMarcaPendente()"
            [style.font-size.px]="tamanhoMarcaPx() * 0.32"
          >
            <span class="mark-label">{{ marca.rotulo }}</span>
          </span>
          <span
            *ngFor="let atual of marcasAtuais(); let i = index; let last = last"
            class="mark mark-current mark-interactive"
            [class.mark-moving]="indiceArrastando() === i"
            [style.left.%]="atual.xPct"
            [style.top.%]="atual.yPct"
            [style.width.px]="tamanhoMarcaPx()"
            [style.height.px]="tamanhoMarcaPx()"
            [style.transform]="transformMarcaAtual()"
            [style.font-size.px]="tamanhoMarcaPx() * 0.32"
            (pointerdown)="onMarcaPointerDown(i, $event)"
            (pointermove)="onMarcaPointerMove(i, $event)"
            (pointerup)="onMarcaPointerUp(i, $event)"
            (pointercancel)="onMarcaPointerUp(i, $event)"
            role="button"
            [attr.aria-label]="'Ponto ' + atual.rotulo + '. Arraste para mover'"
          >
            <span class="mark-label">{{ atual.rotulo }}</span>
            <button
              *ngIf="last"
              type="button"
              class="mark-remove"
              [style.width.px]="tamanhoRemovePx()"
              [style.height.px]="tamanhoRemovePx()"
              [style.top.px]="-tamanhoRemovePx() * 0.35"
              [style.right.px]="-tamanhoRemovePx() * 0.35"
              [style.font-size.px]="tamanhoRemovePx() * 0.7"
              (pointerdown)="$event.stopPropagation()"
              (click)="onRemoverUltimaClick($event)"
              aria-label="Remover último ponto"
            >
              <ion-icon name="close-outline" aria-hidden="true"></ion-icon>
            </button>
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
